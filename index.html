<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>

<body>

    <header>
        <h1>ROCK PAPER SCISSORS</h1>
        <h2 class="result">-- Choose your move --</h2>
    </header>

    <div class="score-card">
        <p class="msg">Choose any of rock, paper or scissors</p>
        <p class="score">Your Score: 0 and Computers Score: 0"</p>
    </div>

    <div class="btn">
        <button class="game-btn" id="paper">Paper</button>
        <button class="game-btn" id="rock">Rock</button>
        <button class="game-btn" id="scissors">Scissors</button>
    </div>

    <div class="reload">
        <button onclick="location.reload()">Restart</button>
    </div>


    <script src="./main.js"></script>
</body>

</html>
